name: Build and Precompile open62541
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code mit Submodules
        uses: actions/checkout@v4
        with:
          ref: v1.3.10
          submodules: recursive

      - name: Build-Tools und ARM-Compiler installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 libmbedtls-dev gcc-arm-none-eabi

      - name: Amalgamierung durchführen
        run: |
          mkdir build && cd build
          cmake -DUA_ENABLE_AMALGAMATION=ON \
                -DUA_ENABLE_ENCRYPTION=ON \
                -DUA_ENABLE_ENCRYPTION_MBEDTLS=ON \
                -DUA_ENABLE_SUBSCRIPTIONS=ON \
                -DUA_ENABLE_METHODCALLS=ON \
                -DUA_ENABLE_HISTORIZING=OFF \
                ..
          cmake --build . --target open62541-amalgamation

      - name: Für Cortex-M7 vorkompilieren
        run: |
          cd build
          arm-none-eabi-gcc -c open62541.c \
            -mcpu=cortex-m7 \
            -mthumb \
            -mfpu=fpv5-d16 \
            -mfloat-abi=hard \
            -Os \
            -ffunction-sections \
            -fdata-sections \
            -I/usr/include \
            -o open62541.o
          arm-none-eabi-ar rcs libopen62541.a open62541.o

      - name: Dateien bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: open62541-cortex-m7-precompiled
          path: |
            build/open62541.h
            build/libopen62541.a
